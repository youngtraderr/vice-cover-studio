<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    
    <div class="group">
      <h3>Layout</h3>
      <select id="layout">
        <option value="grid4">4-Panel Grid</option>
        <option value="grid9">9-Panel Grid</option>
        <option value="tilted">Tilted Snapshot</option>
        <option value="hero3">Hero + 3</option>
        <option value="full" selected>Full Bleed</option>
      </select>
    </div>

    <div class="group">
      <h3>Color Grade</h3>
      <select id="grade">
        <option value="none">None</option>
        <option value="sunset" selected>Sunset</option>
        <option value="neon">Neon</option>
        <option value="dusk">Dusk</option>
        <option value="mono">Mono</option>
      </select>
      <div class="row">
        <label><input type="checkbox" id="grain" checked> Grain</label>
        <label><input type="checkbox" id="vignette" checked> Vignette</label>
      </div>
    </div>

    <div class="group">
      <h3>Photo & Transform</h3>
      <label>Upload Photo <input id="photo" type="file" accept="image/*"></label>
      <div class="transform-controls">
        <label>Zoom <input type="range" id="zoom" min="0.5" max="3" step="0.1" value="1"></label>
        <label>Pan X <input type="range" id="panX" min="-500" max="500" step="10" value="0"></label>
        <label>Pan Y <input type="range" id="panY" min="-500" max="500" step="10" value="0"></label>
        <button id="resetTransform" type="button">Reset Position</button>
      </div>
    </div>

    <div class="group">
      <h3>Title</h3>
      <input id="caption" type="text" maxlength="40" value="VICE CITY">
    </div>

    <button id="export" type="button" class="primary">Export PNG</button>
  </section>
  <div class="canvas-wrap">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
