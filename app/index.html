<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <label>Layout
      <select id="layout">
        <option value="grid4">4-Panel Grid</option>
        <option value="hero3">Hero + 3</option>
        <option value="full">Full Bleed</option>
      </select>
    </label>
    <label>Grade
      <select id="grade">
        <option value="none">None</option>
        <option value="sunset">Sunset</option>
        <option value="neon">Neon</option>
      </select>
    </label>
    <label>Photo <input id="photo" type="file" accept="image/*"></label>
    <label>Caption <input id="caption" type="text" maxlength="40" value="VICE CITY"></label>
    <button id="export" type="button">Export PNG</button>
  </section>
  <canvas id="cover" width="1080" height="1080"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
