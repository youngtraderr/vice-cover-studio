<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>

    <div class="group">
      <h3>Layout</h3>
      <select id="layout">
        <option value="grid4">4-Panel Grid</option>
        <option value="grid9">9-Panel Grid</option>
        <option value="tilted">Tilted Snapshot</option>
        <option value="hero3">Hero + 3</option>
        <option value="full">Full Bleed</option>
      </select>
    </div>

    <div class="group">
      <h3>Color Grade</h3>
      <select id="grade">
        <option value="none">None</option>
        <option value="sunset" selected>Sunset</option>
        <option value="neon">Neon</option>
        <option value="dusk">Dusk</option>
        <option value="mono">Mono</option>
      </select>
      <div class="row">
        <label><input type="checkbox" id="grain" checked> Grain</label>
        <label><input type="checkbox" id="vignette" checked> Vignette</label>
      </div>
    </div>

    <div class="group wide">
      <h3>Photo &amp; Transform</h3>
      <button id="pick-photo" type="button" class="ghost">Choose photo…</button>
      <input id="photo" type="file" accept="image/*" hidden>
      <p id="photo-name" class="hint">Sample photo: pier.jpg</p>
      <div class="transform-controls">
        <label>Panel <span id="panel-label">1 of 4</span></label>
        <label>Zoom <input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1"></label>
        <label>Pan X <input type="range" id="panX" min="-500" max="500" step="5" value="0"></label>
        <label>Pan Y <input type="range" id="panY" min="-500" max="500" step="5" value="0"></label>
        <button id="resetTransform" type="button" class="ghost">Reset this panel</button>
      </div>
    </div>

    <div class="group">
      <h3>Title</h3>
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </div>

    <div class="export-controls">
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="export-all" type="button" class="ghost">Export All</button>
      <label>Export Size
        <select id="export-size">
          <option value="1080x1080">1080 x 1080</option>
          <option value="1080x1350">1080 x 1350</option>
          <option value="1920x1080">1920 x 1080</option>
        </select>
      </label>
    </div>
    <p id="status" role="status"></p>
  </section>
  <div class="canvas-wrap">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
